name: "Bulls & Bears 24/7 Data Pipeline"

on:
  schedule:
    # Runs every 3 hours automatically on GitHub Cloud
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 requests curl_cffi

      - name: Run Master Data Pipeline
        run: |
          # --live attempts live Forex Factory/News scrapes first and falls
          # back to fixture data if Cloudflare blocks the fetch. This keeps
          # the 24/7 pipeline producing fresh JSON every 3 hours.
          python scripts/run_all.py --live

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update fundamental data [skip ci]" && git push)