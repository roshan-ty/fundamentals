name: Daily Data Pipeline
on:
  schedule:
    - cron: '20 3 * * *'    # 03:20 UTC — calendar + actuals + scoring (before US open)
    - cron: '40 12 * * *'   # 12:40 UTC — refresh + re-score (intraday US)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the commit-and-push helper can rebase cleanly
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run data pipeline
        id: pipeline
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          ALPHAVANTAGE_KEY1: ${{ secrets.ALPHAVANTAGE_KEY1 }}
          ALPHAVANTAGE_KEY2: ${{ secrets.ALPHAVANTAGE_KEY2 }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
          MARKETSTACK_KEY: ${{ secrets.MARKETSTACK_KEY }}
          MARKETSTACK_FALLBACK: '1'
        run: python scripts/orchestrator.py all
      - name: Commit data
        run: |
          git config user.name "bbf-bot"
          git config user.email "bbf-bot@users.noreply.github.com"
          git add data/ site/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): automated daily refresh [skip ci]"
            git pull --rebase origin
            git push origin HEAD
          fi