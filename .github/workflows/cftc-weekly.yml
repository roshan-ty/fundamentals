name: Weekly CFTC Refresh
on:
  schedule:
    - cron: '0 1 * * 6'    # Saturday 01:00 UTC — after the Friday 15:30 ET COT release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cftc-weekly
  cancel-in-progress: false

jobs:
  cftc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh CFTC positioning
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          ALPHAVANTAGE_KEY1: ${{ secrets.ALPHAVANTAGE_KEY1 }}
          ALPHAVANTAGE_KEY2: ${{ secrets.ALPHAVANTAGE_KEY2 }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
          MARKETSTACK_KEY: ${{ secrets.MARKETSTACK_KEY }}
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'scripts')
          from collectors.cftc import collect as cftc
          from scoring.cot import collect as cot
          from scoring import verdicts
          cftc()
          cot()
          verdicts.collect()
          PY
      - name: Commit
        run: |
          git config user.name "bbf-bot"
          git config user.email "bbf-bot@users.noreply.github.com"
          git add data/cftc/ data/bias/ data/setups/ data/analysis/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): weekly CFTC refresh [skip ci]"
            git pull --rebase origin
            git push origin HEAD
          fi