name: Fast News
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes — Finnhub news (quota-ledger gates calls)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch news
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'scripts')
          from collectors import news
          env = {'FINNHUB_KEY': os.environ.get('FINNHUB_KEY', ''),
                 'NEWSDATA_KEY': os.environ.get('NEWSDATA_KEY', '')}
          # Fast mode: Finnhub every run; Newsdata only when its free quota allows.
          news.collect(env, mode='fast')
          PY
      - name: Commit
        run: |
          git config user.name "bbf-bot"
          git config user.email "bbf-bot@users.noreply.github.com"
          git add data/news/ data/meta/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): news refresh [skip ci]"
            git pull --rebase origin
            git push origin HEAD
          fi