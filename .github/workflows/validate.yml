name: Validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: JSON validity
        run: |
          python scripts/tests/check_configs.py
      - name: Unit tests (scoring engine)
        run: |
          python -m pytest scripts/tests -q